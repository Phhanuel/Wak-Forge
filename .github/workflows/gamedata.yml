name: Mise à jour des données du jeu

# Chaque lundi (et à la demande), régénère data_item / data_ressource / data_bestiaire
# depuis le CDN Ankama et wakfu.wiki.gg, puis enregistre les changements s'il y en a.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Régénérer les données
        run: node scripts/fetch-gamedata.mjs
      - name: Enregistrer si modifié
        run: |
          if git diff --quiet -- web/data; then
            echo "Aucun changement."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/data
            git commit -m "Données du jeu : mise à jour automatique"
            git push
          fi
