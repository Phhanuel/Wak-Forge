name: Appli PC (release)

# Crée une release avec l'exe à chaque tag "v*" (ex. v2.0.0),
# ou à la demande depuis l'onglet Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le fichier de données
        run: node scripts/check-data.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Compiler l'exe Windows
        working-directory: desktop
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          bash build.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: WakForge
          path: dist/WakForge.exe
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WakForge.exe
          generate_release_notes: true
