name: Appli PC (release)

# Crée une release avec l'exe à chaque tag "v*" (ex. v2.0.0),
# ou à la demande depuis l'onglet Actions : avec une version (ex. v2.11.0),
# le tag et la release sont créés sur le commit choisi ; sans version, l'exe est
# seulement compilé (téléchargeable dans les artefacts du run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. v2.11.0), vide = compiler seulement'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le fichier de données
        run: node scripts/check-data.mjs
      - name: Tests des calculs de craft
        run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Compiler l'exe Windows
        working-directory: desktop
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          bash build.sh "${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: WakForge
          path: dist/WakForge.exe
      - name: Publier la release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/WakForge.exe
          generate_release_notes: true
